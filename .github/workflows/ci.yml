name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - name: Coverage summary
        if: always()
        run: cat coverage/coverage-summary.json 2>/dev/null | head -c 2000 || true

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: capitalos_test
          POSTGRES_USER: capitalos
          POSTGRES_PASSWORD: capitalos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U capitalos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://capitalos:capitalos_test@localhost:5432/capitalos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      # Every migration applies to an empty database, and a second run is a no-op.
      - name: Migrations apply cleanly and are idempotent
        env:
          DATABASE_URL: postgres://capitalos:capitalos_test@localhost:5432/capitalos_test
        run: |
          psql "$DATABASE_URL" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          npm run migrate
          npm run migrate | tee second-run.txt
          grep -q "0 applied" second-run.txt

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production dependencies only: a dev-tool advisory does not ship.
      - run: npm audit --omit=dev --audit-level=high
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [checks]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: capitalos_e2e_test
          POSTGRES_USER: capitalos
          POSTGRES_PASSWORD: capitalos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U capitalos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://capitalos:capitalos_test@localhost:5432/capitalos_e2e_test
      SESSION_SECRET: e2e-session-secret-0123456789abcdef0123456789
      SEC_USER_AGENT: CapitalOS CI ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
